[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "microparticle-detector"
version = "1.0.0"
description = "Dark-ring and multi-source circle detection for brightfield microscopy of colloidal microspheres"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "He Qizhen" }]
keywords = ["microscopy", "particle detection", "colloidal microspheres", "image analysis", "brightfield"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=1.21",
    "opencv-python>=4.5",
    "scipy>=1.7",
    "pillow>=9.0",
]

[project.urls]
Homepage = "https://github.com/HeQizhenJeff/microparticle-detector"
Repository = "https://github.com/HeQizhenJeff/microparticle-detector"
Issues = "https://github.com/HeQizhenJeff/microparticle-detector/issues"

[project.scripts]
microparticle-detect = "microparticle_detector.s6_pipeline:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
microparticle_detector = ["*.py"]
